[custom]
; Clash / ACL4SSR custom 配置（已清理、适配 Clash）
; 说明：
; - 请在替换之前备份原始 custom 文件。
; - 推荐把外部 ruleset URL 锁定到具体 commit SHA（raw.githubusercontent.com/.../<sha>/...）以避免规则被篡改。
; - 我把 overwrite_original_rules 设置为 false 以降低误覆盖风险；如果你确认要覆盖再改回 true。
; - load-balance 健康检查使用单一 URL，请视需要添加备用检测点或监控该地址可用性。

; 基本信息
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线更新版

; 功能支持说明（仅备注）
; 去广告：支持
; 自动测速：支持
; 微软分流：支持
; 苹果分流：支持
; 增强中国IP段：不支持
; 增强国外GFW：不支持
; 多国家分组：支持港/日/美

; ruleset 建议：把 raw URL 固定到 commit SHA，例如：
; https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/<commit_sha>/Clash/ProxyLite.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CMBlog.list
ruleset=🐟 漏网之鱼,FINAL

